<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LibSys AI | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .auth-card {
      background: #ffffff;
      border: 2px solid #f1f5f9;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="auth-card w-full max-w-md p-10 md:p-12">
    <div class="flex flex-col items-center mb-10">
      <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-xl shadow-blue-200 flex items-center justify-center text-3xl font-black mb-6">L</div>
      <h1 class="text-3xl font-black text-slate-900 tracking-tighter italic">LibSys AI</h1>
      <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mt-2">KCDC Internal Support Portal</p>
    </div>

    <div class="space-y-4">
      <div>
        <label for="email" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-2">Internal Email</label>
        <input 
          type="email" 
          id="email" 
          placeholder="name@kapiticoast.govt.nz" 
          class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition-all outline-none font-bold text-slate-800"
        />
      </div>
      
      <div>
        <label for="password" class="block text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 mb-2">Password</label>
        <input 
          type="password" 
          id="password"
          onkeydown="if (event.key === 'Enter') login()" 
          placeholder="••••••••" 
          class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 focus:ring-4 focus:ring-blue-50 focus:border-blue-500 transition-all outline-none font-bold text-slate-800"
        />
      </div>

      <button 
        onclick="login()" 
        id="login-btn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl shadow-blue-100 active:scale-95 transition-all uppercase tracking-widest text-xs mt-6"
      >
        Sign In
      </button>

      <div id="error" class="text-center text-xs font-bold text-red-500 mt-4 min-h-[1.25rem]"></div>
    </div>

    <div class="mt-10 pt-8 border-t border-slate-100 text-center">
      <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Property of Kapiti Coast District Council</p>
    </div>
  </div>

  <script>
    const supabaseUrl = "https://ytztmtcdfqpamhityaqz.supabase.co";
    const supabaseKey = "sb_publishable_QivpXC97wK00Ov2EedYmIg_q_xBc3fk";
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorDiv = document.getElementById("error");
      const loginBtn = document.getElementById("login-btn");

      if (!email || !password) {
        errorDiv.textContent = "Please enter both credentials.";
        return;
      }

      errorDiv.textContent = "";
      loginBtn.disabled = true;
      loginBtn.textContent = "Authenticating...";

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password,
      });

      if (error) {
        errorDiv.textContent = error.message;
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      } else {
        window.location.href = "index.html";
      }
    }

    // Check session
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
