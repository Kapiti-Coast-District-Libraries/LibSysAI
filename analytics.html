<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LibSys AI | Analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    .custom-card {
      background: #ffffff;
      border: 2px solid #f1f5f9;
      border-radius: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    .input-field {
      background-color: #f8fafc;
      border: 2px solid #f1f5f9;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      outline: none;
    }
    .input-field:focus {
      border-color: #2563eb;
      background-color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.05);
    }
    .cost-badge {
      background: #ecfdf5;
      color: #059669;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.75rem;
    }
    .month-header {
      background: #f8fafc;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.025em;
    }
  </style>
</head>
<body class="min-h-screen p-6 md:p-12">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-blue-600 text-white rounded-2xl shadow-lg shadow-blue-100 flex items-center justify-center text-xl font-black">L</div>
        <div>
          <h1 class="text-2xl font-black text-slate-900 tracking-tight italic">Usage Analytics</h1>
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Admin Dashboard</p>
        </div>
      </div>
      <div id="authMessage" class="text-sm font-bold text-slate-400 animate-pulse">Checking permissions...</div>
      <button onclick="window.location.href='index.html'" class="px-6 py-3 border-2 border-slate-200 hover:border-blue-600 hover:text-blue-600 rounded-2xl text-xs font-black transition-all bg-white shadow-sm">
        Return to App
      </button>
    </header>

    <div id="dashboard" class="hidden space-y-8">
      
      <!-- Summary Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="custom-card p-8 flex flex-col justify-center">
          <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Total System Requests</span>
          <div class="text-5xl font-black text-blue-600 tracking-tighter" id="totalRpd">0</div>
        </div>
        
        <!-- Filters Card -->
        <div class="md:col-span-2 custom-card p-8">
          <div class="flex items-center gap-2 mb-6">
            <span class="text-xs font-black text-slate-900 uppercase tracking-widest">Filters</span>
            <div class="h-px flex-1 bg-slate-100"></div>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="flex flex-col gap-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Single Day</label>
              <input type="date" id="day" class="input-field">
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">User UUID</label>
              <select id="userFilter" class="input-field">
                <option value="">All Users</option>
                <option value="">Paid</option>
              </select>
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Start Date</label>
              <input type="date" id="start" class="input-field">
            </div>
            <div class="flex flex-col gap-2">
              <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">End Date</label>
              <input type="date" id="end" class="input-field">
            </div>
          </div>
          
          <div class="flex gap-3 mt-6">
            <button onclick="loadData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl shadow-lg shadow-blue-100 transition-all text-xs uppercase tracking-widest">
              Apply Search
            </button>
            <button onclick="resetFilters()" class="px-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-black py-3 rounded-xl transition-all text-xs uppercase tracking-widest">
              Reset
            </button>
          </div>
        </div>
      </div>

      <!-- Billing History Table (Detailed Grouping) -->
      <div class="custom-card overflow-hidden">
        <div class="p-8 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
          <div>
            <h3 class="font-black text-slate-900 tracking-tight">Monthly Billing Cycles</h3>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">Rate: $4.50 per 100 RPD</p>
          </div>
          <div class="flex items-center gap-4">
             <div class="flex flex-col items-end">
                <label class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Select Billing Cycle</label>
                <select id="cycleSelector" onchange="renderBillingTable()" class="input-field py-2 px-4 text-xs font-black text-blue-600 border-blue-100 bg-blue-50/30">
                  <option value="all">View All Cycles</option>
                  <!-- Options populated dynamically -->
                </select>
             </div>
             <span class="hidden md:inline-block text-[10px] font-black text-green-600 bg-green-50 px-3 py-1 rounded-full uppercase tracking-widest">Budgeting Mode</span>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="bg-slate-50 border-b border-slate-100">
                <th class="px-8 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Company / Account Details</th>
                <th class="px-8 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">RPD Units</th>
                <th class="px-8 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Net Charge (NZD)</th>
              </tr>
            </thead>
            <tbody id="billingBody" class="divide-y divide-slate-50 text-slate-700">
              <!-- Nested billing rows injected here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- User Breakdown Table (Simple Summary) -->
      <div class="custom-card overflow-hidden">
        <div class="p-8 border-b border-slate-50 flex items-center justify-between">
          <h3 class="font-black text-slate-900 tracking-tight">System-Wide User Totals</h3>
          <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest">Aggregate Data</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="bg-slate-50">
                <th class="px-8 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest">Account Identification</th>
                <th class="px-8 py-4 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Cumulative RPD</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-50 font-medium text-slate-700">
              <!-- Summary rows injected here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    import { supabaseClient } from "./supabase"
    const ADMIN_UUID = "753c187c-5c83-44c1-a01b-f02d5537ab62";
    const COST_RATE = 4.50 / 100; // $4.50 per 100 RPD

    let currentData = [];
    let billingMap = {};


    async function loadUserDropdown(){
  const { data, error } = await supabaseClient
    .from("user_emails")
    .select("id,email")
    .order("email");

  if(error){
    console.error(error);
    return;
  }

  const select = document.getElementById("userFilter");

  data.forEach(u=>{
    const opt = document.createElement("option");
    opt.value = u.id;
    opt.textContent = u.email;
    select.appendChild(opt);
  });
}

    async function checkAuth(){
      const { data:{ user } } = await supabaseClient.auth.getUser();

      if(!user){
        document.getElementById("authMessage").innerText = "Not logged in.";
        document.getElementById("authMessage").classList.remove("text-slate-400");
        document.getElementById("authMessage").classList.add("text-red-500");
        return;
      }

      if(user.id !== ADMIN_UUID){
        document.getElementById("authMessage").innerText = "Access denied.";
        document.getElementById("authMessage").classList.remove("text-slate-400");
        document.getElementById("authMessage").classList.add("text-red-500");
        return;
      }

      document.getElementById("authMessage").remove();
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      await loadUserDropdown();
      loadData();
    }
    const EXCLUDED_EMAIL = "admin@email.com";
    async function loadData(){
      const totalDisplay = document.getElementById("totalRpd");
      totalDisplay.classList.add("animate-pulse");

      let query = supabaseClient.from("usage_with_email").select("*")

      const day = document.getElementById("day").value;
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;
      const user = document.getElementById("userFilter").value.trim();

      if(day) query = query.eq("Date", day);
      if(start) query = query.gte("Date", start);
      if(end) query = query.lte("Date", end);
      if(user === "__exclude_admin__"){
      query = query.neq("email", EXCLUDED_EMAIL);
      }
      else if(user){
        query = query.eq("User Account", user);
      }


      const { data, error } = await query;

      if(error){
        alert(error.message);
        totalDisplay.classList.remove("animate-pulse");
        return;
      }

      currentData = data;
      processData(data);
      renderAll();
      totalDisplay.classList.remove("animate-pulse");
    }

    function processData(rows) {
      billingMap = {};
      rows.forEach(r => {
        if (r.Date) {
          const date = new Date(r.Date);
          const monthKey = date.toLocaleString('default', { month: 'long', year: 'numeric' });
          const sortKey = r.Date.substring(0, 7); // YYYY-MM for sorting

          if (!billingMap[sortKey]) {
            billingMap[sortKey] = { 
              label: monthKey, 
              totalRpd: 0,
              accounts: {} 
            };
          }

          const accountKey = r.email || r["User Account"] || "Unknown Account";
          if (!billingMap[sortKey].accounts[accountKey]) {
            billingMap[sortKey].accounts[accountKey] = 0;
          }

          billingMap[sortKey].accounts[accountKey] += r.RPD;
          billingMap[sortKey].totalRpd += r.RPD;
        }
      });

      // Update Selector
      const selector = document.getElementById("cycleSelector");
      const currentVal = selector.value;
      selector.innerHTML = '<option value="all">View All Cycles</option>';
      
      const sortedMonths = Object.keys(billingMap).sort((a, b) => b.localeCompare(a));
      sortedMonths.forEach(key => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = billingMap[key].label;
        selector.appendChild(option);
      });
      
      if (billingMap[currentVal]) selector.value = currentVal;
    }

    function renderAll() {
      renderSummaryTable();
      renderBillingTable();
    }

    function renderSummaryTable() {
      const userMap = {};
      let total = 0;

      currentData.forEach(r => {
        total += r.RPD;
        const key = r.email || r["User Account"] || "Unknown Account";
        if(!userMap[key]) userMap[key] = 0;
        userMap[key] += r.RPD;
      });

      document.getElementById("totalRpd").innerText = total.toLocaleString();

      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";
      Object.entries(userMap).forEach(([email, rpd]) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-blue-50/30 transition-colors";
        tr.innerHTML = `
          <td class="px-8 py-5 text-sm font-bold text-slate-800 font-mono tracking-tight">${email}</td>
          <td class="px-8 py-5 text-sm font-black text-slate-900 text-right">${rpd.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });

      if (Object.keys(userMap).length === 0) {
        tbody.innerHTML = `<tr><td colspan="2" class="px-8 py-20 text-center text-slate-400 font-bold uppercase tracking-widest text-xs">No user data found</td></tr>`;
      }
    }

    function renderBillingTable() {
      const billingTbody = document.getElementById("billingBody");
      const filterMonth = document.getElementById("cycleSelector").value;
      billingTbody.innerHTML = "";
      
      const sortedMonths = Object.keys(billingMap).sort((a, b) => b.localeCompare(a));
      
      sortedMonths.forEach(key => {
        if (filterMonth !== 'all' && filterMonth !== key) return;

        const monthData = billingMap[key];
        
        // Month Header Row (BOLD)
        const headerTr = document.createElement("tr");
        headerTr.className = "month-header";
        headerTr.innerHTML = `
          <td class="px-8 py-4 text-base" colspan="3">
            <span class="flex items-center gap-2">
               <svg class="w-4 h-4 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path></svg>
               ${monthData.label}
            </span>
          </td>
        `;
        billingTbody.appendChild(headerTr);

        // Sub-rows for each account (NOT BOLD)
        Object.entries(monthData.accounts).forEach(([account, rpd]) => {
          const cost = rpd * COST_RATE;
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-50 transition-colors border-l-4 border-l-transparent hover:border-l-blue-400";
          tr.innerHTML = `
            <td class="px-10 py-4 text-sm font-medium text-slate-500 italic">${account}</td>
            <td class="px-8 py-4 text-sm font-medium text-slate-600 text-right">${rpd.toLocaleString()}</td>
            <td class="px-8 py-4 text-right">
              <span class="cost-badge">$${cost.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
            </td>
          `;
          billingTbody.appendChild(tr);
        });

        // Month Footer Summary (Optional but helpful)
        const footerTr = document.createElement("tr");
        footerTr.className = "bg-slate-50/30";
        footerTr.innerHTML = `
          <td class="px-8 py-3 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Cycle Total:</td>
          <td class="px-8 py-3 text-sm font-black text-slate-900 text-right">${monthData.totalRpd.toLocaleString()}</td>
          <td class="px-8 py-3 text-right text-sm font-black text-blue-600">
            $${(monthData.totalRpd * COST_RATE).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
          </td>
        `;
        billingTbody.appendChild(footerTr);
      });

      if (sortedMonths.length === 0) {
        billingTbody.innerHTML = `<tr><td colspan="3" class="px-8 py-20 text-center text-slate-400 font-bold uppercase tracking-widest text-xs">No billing cycles found</td></tr>`;
      }
    }

    function resetFilters(){
      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("cycleSelector").value = "all";
      loadData();
    }

    checkAuth();
  </script>
</body>
</html>
